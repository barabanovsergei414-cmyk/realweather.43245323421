name: Build PMWeather Tornado Addon

'on':
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.java'
      - '**/*.toml'
      - '**/*.json'
      - '**/*.ogg'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
          cache-disabled: false

      - name: Compile addon
        run: gradle clean build --no-daemon --stacktrace

      - name: Upload addon JAR
        uses: actions/upload-artifact@v4
        with:
          name: PMWeather-Tornado-Addon-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
